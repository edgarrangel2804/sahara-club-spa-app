name: sahara_club_spa_app
description: "Sahara Club Spa - App de reservaciones, membresías y bienestar."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.0.0

  # Firebase (Push Notifications)
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Internacionalización
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI & UX
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0

  # Firma digital (consentimientos)
  signature: ^5.4.1

  # Imágenes
  image_picker: ^1.1.2

  # Llamadas y links externos
  url_launcher: ^6.3.0

  # Utilidades
  uuid: ^4.3.3
  path_provider: ^2.1.2
  permission_handler: ^11.3.1

  # Notificaciones locales
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # PDF (comprobantes, consentimientos)
  pdf: ^3.12.0
  printing: ^5.14.3

  # Chat multimedia
  file_picker: ^8.0.3

  # Splash animado (Lottie — listo para cuando tengas el JSON)
  lottie: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1A0A0B"
  adaptive_icon_foreground: "assets/images/adatative.png"
  web:
    generate: false
  windows:
    generate: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/lottie/
